# FreshClam and ClamD share the same persistent database directory. The daemon
# is notified after an update so new signatures are loaded without a restart.
DatabaseOwner clamav
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
Checks 24
NotifyClamd /etc/clamav/clamd.conf
TestDatabases yes
ScriptedUpdates yes

Foreground yes
ConnectTimeout 30
ReceiveTimeout 60
LogTime yes
UpdateLogFile /dev/stdout
LogFileMaxSize 0
