# ClamD receives only INSTREAM bytes from SecureStore. TCP port 3310 must stay
# on the private scanner network and must never be published by public ingress.
Foreground yes
User clamav
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav

# SecureStore admits at most 25 MiB; the daemon ceiling includes protocol and
# decoder overhead while remaining tightly bounded.
StreamMaxLength 26M
MaxScanSize 26M
MaxFileSize 25M
MaxRecursion 16
MaxFiles 10000

MaxThreads 4
MaxQueue 20
ReadTimeout 30
CommandReadTimeout 5
SendBufTimeout 500
SelfCheck 600

# Treat password-protected content as uninspectable and allow only signed
# bytecode signatures at the scanner boundary.
AlertEncrypted yes
Bytecode yes
BytecodeSecurity TrustSigned

LogTime yes
LogClean no
LogVerbose no
# Foreground mode inherits the container's stdout/stderr streams. Configuring
# /dev/stdout as a ClamAV-managed regular log file fails in the Debian image
# because the descriptor resolves to a pipe rather than a seekable file.
ExitOnOOM yes
